<!--
  管理台图标（2026-10-14）
  ============================================================================
  为什么要有这个文件：没有 <link rel="icon"> 时，浏览器会**自动**去请求
  `/favicon.ico`，而我们没有（也不该有）根目录静态托管 ⇒ 每次开台都在控制台
  留一条 404。这条噪音会掩盖真正的 404（"某个接口路径写错了"），
  在 `tests/admin-web-smoke.mjs` 里也会把门禁判红。

  为什么用 SVG 而不是 .ico：零构建路线下不愿意引入二进制小文件（谁改的、
  改了什么在 diff 里都看不出来）；SVG 是纯文本，可读可改，且现代浏览器都支持。
  颜色用与界面主色一致的青绿（css/style.css 的 --brand）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="智慧医院导诊后台">
  <rect width="64" height="64" rx="12" fill="#12866f"/>
  <path d="M28 12h8v16h16v8H36v16h-8V36H12v-8h16z" fill="#ffffff"/>
</svg>
