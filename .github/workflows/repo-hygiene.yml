# 仓库卫生门禁（2026-10-17 加，对应评审 P1-4「零 CI」）
#
# 为什么只做这一层、不在这里编服务端：
#   · 服务端要 cjc 1.2.0 + stdx 1.1.3.1 + 自编 MariaDB 驱动 + MariaDB 实例，
#     GH 托管 runner 上装不全，硬凑出来的红灯只会被绕过；
#   · 但"文档链接断没断、脚本编码对不对、旧路径有没有残留"这类**纯文本**违规
#     恰恰是本项目历史上反复出问题的地方（改仓库名、改数字、改措辞之后忘了同步）。
#   ⇒ 这一层放 CI 每次跑（几十秒），重活留在 server/tests/ 与 final-verify.ps1 里手工跑。
#
# 本地等价命令：powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-docs.ps1
name: repo-hygiene

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: 文档链接 / 脚本编码 / 旧路径
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆（默认 fetch-depth:1）拿不到 tag 与祖先历史，check-snapshot 的
          # 「tag 存在」与「commit 祖先判定」会在 CI 里误报 FAIL。拉全历史即连带拉 tag。
          fetch-depth: 0
      - name: Run tools/check-docs.ps1
        shell: pwsh
        run: ./tools/check-docs.ps1
      - name: Run tools/check-snapshot.ps1
        shell: pwsh
        run: ./tools/check-snapshot.ps1