# 仓库卫生门禁（2026-10-17 加，对应评审 P1-4「零 CI」；2026-10-21 按评估报告第 ③ 条扩了两层）
#
# 这个工作流有**三层**，每一层能证明的东西不同，别混：
#   1) docs            —— 文档相对链接、脚本编码、旧路径残留、注释嵌套（纯文本，几十秒）
#   2) source-manifest —— 分发包里的 exe 与仓库源码是不是同一份（**托管 runner 上也能真绿**）
#   3) build-and-test  —— 真的装 cjc 1.2.0 编译、再跑 selftest/authtest/triagetest
#      SDK 来自本仓库 release `sdk-cache-1.2.0` 的资产（官方直链签名且短命，不能当 CI 来源）
#
# 关于第 3 层（2026-10-21 第二轮评估后的调整）：
#   上一版把编译层挂在 `if: vars.CANGJIE_SDK_URL != ''` 上 ⇒ **默认不跑**，
#   于是公开仓库上永远没有一次"编译通过"的记录（评估报告第 ② 条）。现在改成：
#     · 默认**就跑**（去掉 if），SDK 直链解析顺序：
#         ① 仓库变量 CANGJIE_SDK_URL（仓库管理员可覆盖，推荐）
#         ② 本机/runner 环境变量 CANGJIE_SDK_URL
#         ③ 工具脚本 tools/resolve-cangjie-sdk-url.ps1 从官网下载页嗅探（会变，失败即止）
#     · 三个来源都拿不到 ⇒ 打印 `::notice::` 并在 step summary 里写明
#       「编译层未执行：缺 SDK 直链」，job 结果为 green 但**不含编译证据**——
#       这一层真正算数的证据是下面第 2 层（manifest 逐字节比对）+ 仓库内的构建日志，
#       我们不把"没编"伪装成"编过了"。
#     · 只要给了 SDK_URL，编译失败/版本不是 1.2.0/三件套有红 ⇒ **job 必红**。
#     · 上一版的 `pure-tests` job 删掉了：它在 runner 上必然 SKIP（没有 exe），
#       等于一条绿色但什么都没测的检查；它的职责已由本层的「跑三件套」承担，
#       本地等价命令仍是 tools/ci-pure-tests.ps1。
#
# 本地等价命令：
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-docs.ps1
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-snapshot.ps1
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-pure-tests.ps1
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-source-manifest.ps1
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\resolve-cangjie-sdk-url.ps1   # 嗅探 SDK 直链
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\set-ci-sdk-url.ps1 -Url '<SDK 直链>'  # 一条命令配 ①（见 tools/README.md）
name: repo-hygiene

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: 文档链接 / 脚本编码 / 旧路径
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆（默认 fetch-depth:1）拿不到 tag 与祖先历史，check-snapshot 的
          # 「tag 存在」与「commit 祖先判定」会在 CI 里误报 FAIL。拉全历史即连带拉 tag。
          fetch-depth: 0
      - name: Run tools/check-docs.ps1
        shell: pwsh
        run: ./tools/check-docs.ps1
      - name: Run tools/check-snapshot.ps1
        shell: pwsh
        run: ./tools/check-snapshot.ps1

  source-manifest:
    name: 分发包 ↔ 源码一致性（不需要编译器）
    # ★ 2026-10-21 加（评估报告第 ③ 条的折中）：
    #   评委拿到的是 release/*.zip 里的 exe，但 exe 不入库 —— 那怎么证明"它就是这么编出来的"？
    #   包内带 SOURCE-MANIFEST.sha256（76 个源文件 + 工具链指纹），本 job 解包后按清单
    #   重算仓库源码的 sha256 并逐字节比对。**纯哈希运算，托管 runner 上稳定真绿**，
    #   而且一旦"改了源码忘了重打包"就会红。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解出分发包里的 SOURCE-MANIFEST.sha256
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { Write-Host "❌ release/ 下没有分发包"; exit 1 }
          Write-Host "分发包：$($zip.Name)（$([math]::Round($zip.Length/1MB,2)) MB）"
          New-Item -ItemType Directory -Force .ci-unzip | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .ci-unzip -Force
          $mf = Get-ChildItem .ci-unzip -Recurse -Filter SOURCE-MANIFEST.sha256 | Select-Object -First 1
          if (-not $mf) { Write-Host "❌ 包内没有 SOURCE-MANIFEST.sha256"; exit 1 }
          New-Item -ItemType Directory -Force server/build | Out-Null
          Copy-Item $mf.FullName server/build/SOURCE-MANIFEST.sha256 -Force
          Get-Content server/build/SOURCE-MANIFEST.sha256 | Select-Object -Last 3
      - name: 逐文件比对 sha256
        shell: pwsh
        run: ./tools/verify-source-manifest.ps1

  build-and-test:
    name: 真编译 + 三件套（selftest / authtest / triagetest）
    # ★ 2026-10-21 第三轮：默认来源改成**仓库自己的 Release 资产**。
    #   原因：官方下载页的直链是点击时签名生成的（几分钟就失效，且对任意路径都回 200 + text/html），
    #   没法当 CI 的稳定来源。于是把官方安装包托管在 release `sdk-cache-1.2.0`（Apache-2.0 with
    #   Runtime Library Exception，安装包内自带 LICENSE，仓库里也 vendored 了一份），
    #   CI 用 GITHUB_TOKEN 从自己的 release 下载 —— 不依赖任何外部签名直链，且私有仓库也能跑。
    #   想换成别处托管的包：设仓库变量 CANGJIE_SDK_URL（.zip 或 .exe 都行），优先于默认来源。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 决定 SDK 来源（仓库变量优先，否则用本仓库的 Release 资产）
        id: sdk
        shell: pwsh
        run: |
          $configured = "${{ vars.CANGJIE_SDK_URL }}"
          if (-not $configured) { $configured = $env:CANGJIE_SDK_URL }
          if ($configured -and $configured.Trim()) {
            "SOURCE=config" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "SDK_URL=$($configured.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "来源：仓库变量/环境变量 CANGJIE_SDK_URL"
          } else {
            "SOURCE=release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $resolved = $null
            try { $resolved = & "$PWD/tools/resolve-cangjie-sdk-url.ps1" -Version '1.2.0' -Quiet 2>$null } catch { $resolved = $null }
            if ($resolved) {
              "FALLBACK_URL=$($resolved.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "来源：Release 资产；官网嗅探另有候选（备而不用）"
            } else {
              Write-Host "来源：Release 资产 sdk-cache-1.2.0"
            }
          }
          # 嗅探脚本按设计会 exit 1（拿不到签名直链时的如实结果），
          # 不能让它的 $LASTEXITCODE 把这一步判红 —— 本步的结论只由上面的来源解析决定。
          $global:LASTEXITCODE = 0
          exit 0

      - name: 缓存仓颉 SDK（命中则跳过 ~93 MB 下载与安装）
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\cangjie-sdk
          key: cangjie-sdk-windows-x64-1.2.0-installed

      - name: 取 SDK 安装包 / 压缩包
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dl = Join-Path $env:RUNNER_TEMP 'sdkdl'
          New-Item -ItemType Directory -Force $dl | Out-Null
          if ("${{ steps.sdk.outputs.SOURCE }}" -eq 'config') {
            $url = "${{ steps.sdk.outputs.SDK_URL }}"
            Write-Host "下载（配置来源）：$url"
            $out = Join-Path $dl (Split-Path ([uri]$url).AbsolutePath -Leaf)
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 1800
          } else {
            # gh 在 windows-latest 上预装；私有仓库用 github.token 也能下自己的 release 资产
            $ok = $false
            try {
              gh release download sdk-cache-1.2.0 --pattern '*1.2.0*' --dir $dl --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true }
            } catch { $ok = $false }
            if (-not $ok) {
              $fallback = "${{ steps.sdk.outputs.FALLBACK_URL }}"
              if (-not $fallback) { Write-Host "::error title=取不到 SDK::release 资产下载失败，且没有备用直链"; exit 1 }
              Write-Host "release 资产下载失败，退回备用直链：$fallback"
              Invoke-WebRequest -Uri $fallback -OutFile (Join-Path $dl 'cj.zip') -UseBasicParsing -TimeoutSec 1800
            }
          }
          $pkg = Get-ChildItem -LiteralPath $dl -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $pkg) { Write-Host "::error title=取不到 SDK::下载目录是空的"; exit 1 }
          "PKG=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host ("拿到安装包：" + $pkg.Name + "（" + [Math]::Round($pkg.Length/1MB,1) + " MB）")

      - name: 静默安装 / 解包到 runner.temp\cangjie-sdk
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $pkg = "${{ steps.sdk.outputs.PKG }}"
          $dst = Join-Path $env:RUNNER_TEMP 'cangjie-sdk'
          if (Test-Path $dst) { Remove-Item -LiteralPath $dst -Recurse -Force }
          if ($pkg -match '\.zip$') {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Expand-Archive -LiteralPath $pkg -DestinationPath $dst -Force
          } else {
            # NSIS 安装包：/S 静默、/D= 指定目录（必须是最后一个参数且不加引号）
            Write-Host "静默安装：$pkg → $dst"
            $proc = Start-Process -FilePath $pkg -ArgumentList '/S', ("/D=" + $dst) -Wait -PassThru
            if ($proc.ExitCode -ne 0) { Write-Host "::error title=安装失败::退出码 $($proc.ExitCode)"; exit 1 }
          }

      - name: 定位 CANGJIE_HOME 并验版本 1.2.0
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cangjie-sdk'
          $cjc = Get-ChildItem $root -Recurse -Filter cjc.exe -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $cjc) { Write-Host "::error title=SDK 不完整::找不到 cjc.exe"; exit 1 }
          $home2 = Split-Path -Parent (Split-Path -Parent $cjc.FullName)
          "CANGJIE_HOME=$home2" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$home2\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:CANGJIE_HOME = $home2
          $v = (& $cjc.FullName --version 2>&1) -join ' '
          Write-Host "cjc --version：$v"
          if ($v -notmatch '1\.2\.0') { Write-Host "::error title=版本不符::需要 1.2.0，实际 $v"; exit 1 }

      - name: 编译服务端（含自编 MariaDB 驱动）
        if: steps.sdk-url.outputs.SDK_SOURCE != 'none'
        shell: pwsh
        run: |
          cd server
          ./build-mysql-driver.ps1 -CangjieHome "$env:CANGJIE_HOME"
          ./build.ps1 -CangjieHome "$env:CANGJIE_HOME"

      - name: 跑三件套（纯逻辑，不需要数据库）
        if: steps.sdk-url.outputs.SDK_SOURCE != 'none'
        shell: pwsh
        run: |
          $exe = "server/build/hospital-server.exe"
          if (-not (Test-Path $exe)) { Write-Host "❌ 没有产物"; exit 1 }
          $fail = 0
          foreach ($k in 'selftest', 'authtest', 'triagetest') {
            Write-Host "===== $k ====="
            & $exe $k
            if ($LASTEXITCODE -ne 0) { $fail++ ; Write-Host "❌ $k 失败" }
          }
          if ($fail -gt 0) { exit 1 }
          Write-Host "✅ 编译 + 三件套全绿"

      - name: 上传构建日志（失败也要能看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            server/build/*.txt
            server/build/SOURCE-MANIFEST.sha256
          if-no-files-found: ignore
