# 仓库卫生门禁（2026-10-17 加，对应评审 P1-4「零 CI」；2026-10-21 按评估报告第 ③ 条扩了两层）
#
# 这个工作流现在有**四层**，每一层能证明的东西不同，别混：
#   1) docs            —— 文档相对链接、脚本编码、旧路径残留、注释嵌套（纯文本，几十秒）
#   2) pure-tests      —— selftest / authtest / triagetest（纯逻辑，**没有编译器时诚实 SKIP**）
#   3) source-manifest —— 分发包里的 exe 与仓库源码是不是同一份（**托管 runner 上也能真绿**）
#   4) build-and-test  —— 真的装 cjc 1.2.0 编译、再跑三件套（**默认关闭，见下**）
#
# 关于第 4 层（为什么默认不跑、怎么打开）：
#   编译要 cangjie-sdk-windows-x64-1.2.0（约 250 MB）与 stdx 1.1.3.1，官方下载页
#   https://cangjie-lang.cn/download/1.2.0 的直链由前端签名生成、会变，**不适合写死在仓库里**。
#   所以它靠仓库变量 `CANGJIE_SDK_URL` 打开：
#     Settings → Secrets and variables → Actions → Variables → New repository variable
#       CANGJIE_SDK_URL = <cangjie-sdk-windows-x64-1.2.0.zip 的直链>
#   变量没配时该 job 会**打印说明并跳过**（不是绿灯，是 neutral 的 notice + step summary）；
#   配了之后它必须真编译成功，否则红 —— 这样"配上就真跑"和"没配别假绿"两件事都成立。
#
# 本地等价命令：
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-docs.ps1
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-snapshot.ps1
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\ci-pure-tests.ps1
#   powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-source-manifest.ps1
name: repo-hygiene

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: 文档链接 / 脚本编码 / 旧路径
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 浅克隆（默认 fetch-depth:1）拿不到 tag 与祖先历史，check-snapshot 的
          # 「tag 存在」与「commit 祖先判定」会在 CI 里误报 FAIL。拉全历史即连带拉 tag。
          fetch-depth: 0
      - name: Run tools/check-docs.ps1
        shell: pwsh
        run: ./tools/check-docs.ps1
      - name: Run tools/check-snapshot.ps1
        shell: pwsh
        run: ./tools/check-snapshot.ps1

  pure-tests:
    name: 纯逻辑测试（selftest / authtest / triagetest，不需要数据库）
    # ★ 2026-10-21 加（评估报告 P1-3）：此前 CI 只跑文本卫生检查，
    #   "accept 821 条断言"这种自证材料只能靠我们自述。
    #   这三个子命令是**纯函数**测试（口令原语、状态机、分诊规则），不碰 MySQL。
    #
    # ⚠ 诚实说明：它们编译在 hospital-server.exe 里，而 runner 上没有仓颉工具链，
    #   所以这里默认会 SKIP 而不是假绿（见 tools/ci-pure-tests.ps1 文件头）。
    #   "真编译真跑"是下面 build-and-test 的职责。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tools/ci-pure-tests.ps1
        shell: pwsh
        run: ./tools/ci-pure-tests.ps1

  source-manifest:
    name: 分发包 ↔ 源码一致性（不需要编译器）
    # ★ 2026-10-21 加（评估报告第 ③ 条的折中）：
    #   评委拿到的是 release/*.zip 里的 exe，但 exe 不入库 —— 那怎么证明"它就是这么编出来的"？
    #   包内带 SOURCE-MANIFEST.sha256（76 个源文件 + 工具链指纹），本 job 解包后按清单
    #   重算仓库源码的 sha256 并逐字节比对。**纯哈希运算，托管 runner 上稳定真绿**，
    #   而且一旦"改了源码忘了重打包"就会红。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解出分发包里的 SOURCE-MANIFEST.sha256
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { Write-Host "❌ release/ 下没有分发包"; exit 1 }
          Write-Host "分发包：$($zip.Name)（$([math]::Round($zip.Length/1MB,2)) MB）"
          New-Item -ItemType Directory -Force .ci-unzip | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .ci-unzip -Force
          $mf = Get-ChildItem .ci-unzip -Recurse -Filter SOURCE-MANIFEST.sha256 | Select-Object -First 1
          if (-not $mf) { Write-Host "❌ 包内没有 SOURCE-MANIFEST.sha256"; exit 1 }
          New-Item -ItemType Directory -Force server/build | Out-Null
          Copy-Item $mf.FullName server/build/SOURCE-MANIFEST.sha256 -Force
          Get-Content server/build/SOURCE-MANIFEST.sha256 | Select-Object -Last 3
      - name: 逐文件比对 sha256
        shell: pwsh
        run: ./tools/verify-source-manifest.ps1

  build-and-test:
    name: 真编译 + 三件套（需 CANGJIE_SDK_URL）
    # ★ 2026-10-21 加（评估报告第 ③ 条）：纯逻辑 job 在 runner 上必然 SKIP ⇒ 编译绿这条证据是空的。
    #   这里真的下载 cjc 1.2.0、编出 hospital-server.exe、跑 selftest/authtest/triagetest。
    #   ⚠ 默认**不跑**：直链由官方前端签名生成、会变，不适合写死。配好仓库变量即启用。
    if: ${{ vars.CANGJIE_SDK_URL != '' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 缓存仓颉 SDK（命中则跳过 250 MB 下载）
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: C:\cangjie-sdk
          key: cangjie-sdk-windows-x64-1.2.0

      - name: 下载并解包 cjc 1.2.0
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "${{ vars.CANGJIE_SDK_URL }}"
          Write-Host "下载：$url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cj.zip" -UseBasicParsing -TimeoutSec 1800
          New-Item -ItemType Directory -Force C:\cangjie-sdk | Out-Null
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\cj.zip" -DestinationPath C:\cangjie-sdk -Force

      - name: 定位 CANGJIE_HOME 并验版本
        shell: pwsh
        run: |
          $cjc = Get-ChildItem C:\cangjie-sdk -Recurse -Filter cjc.exe | Select-Object -First 1
          if (-not $cjc) { Write-Host "❌ 包里找不到 cjc.exe"; exit 1 }
          $home = Split-Path -Parent (Split-Path -Parent $cjc.FullName)
          "CANGJIE_HOME=$home" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:CANGJIE_HOME = $home
          & $cjc.FullName --version
          # build.ps1 会自己按版本挑 cjc，并要求 1.2.0（1.1.3 会 LLVM ERROR）
          $v = (& $cjc.FullName --version) -join ' '
          if ($v -notmatch '1\.2\.0') { Write-Host "❌ 版本不是 1.2.0：$v"; exit 1 }

      - name: 编译服务端（含自编 MariaDB 驱动）
        shell: pwsh
        run: |
          cd server
          ./build-mysql-driver.ps1 -CangjieHome "$env:CANGJIE_HOME"
          ./build.ps1 -CangjieHome "$env:CANGJIE_HOME"

      - name: 跑三件套（纯逻辑，不需要数据库）
        shell: pwsh
        run: |
          $exe = "server/build/hospital-server.exe"
          if (-not (Test-Path $exe)) { Write-Host "❌ 没有产物"; exit 1 }
          $fail = 0
          foreach ($k in 'selftest', 'authtest', 'triagetest') {
            Write-Host "===== $k ====="
            & $exe $k
            if ($LASTEXITCODE -ne 0) { $fail++ ; Write-Host "❌ $k 失败" }
          }
          if ($fail -gt 0) { exit 1 }
          Write-Host "✅ 编译 + 三件套全绿"

      - name: 上传构建日志（失败也要能看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            server/build/*.txt
            server/build/SOURCE-MANIFEST.sha256
          if-no-files-found: ignore
