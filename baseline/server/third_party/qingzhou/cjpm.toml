[package]
  cjc-version = "1.0.5"
  name = "qingzhou"
  description = "QingZhou (轻舟) - a Koa-style web framework for the Cangjie language"
  version = "0.1.0"
  target-dir = "build"
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[target.x86_64-w64-mingw32]
  link-option = "-lcrypt32"

[dependencies]
  net = { path = "net" }
  crypto = { path = "crypto" }
  encoding = { path = "encoding" }

[source]
  exclude-dirs = ["build", "examples", "public"]

# ---------------------------------------------------------------------------
# NOTE (Windows workaround, read before using cjpm):
#
# cjpm.exe on this machine (Cangjie toolchain 1.0.5, Windows x64) is
# UNSTABLE: it segfaults (0xC0000005) unless HOME is a Windows-style path,
# crashes when cwd is outside its own bin directory, and init/build
# intermittently hang or fail even with a valid toml.
#
# The project therefore builds via cjc directly; see build.cmd.txt for the
# exact, known-good command line. This cjpm.toml is kept for portability
# on machines where cjpm works (Linux/macOS, or newer Windows toolchains).
#
# stdx deps are resolved via the toolchain's stdx registry. On Windows we
# link the STATIC stdx archives from
#   %USERPROFILE%\.cangjie\stdx\cangjie-stdx-windows-x64-1.0.5.1\static\stdx
# because the dynamic tree ships .dll only (no import libs).
#
# Package layout note: the framework sources live flat in src/ under
# package name `qingzhou` (25 .cj files, all one package). The middleware
# suite is logically split into a separate `qingzhou-middlewares` package
# per docs/PACKAGING.md, to be physically split once cjpm build is stable.
# ---------------------------------------------------------------------------
